<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            z-index: 10;
            backdrop-filter: blur(10px);
            transition: transform 0.4s ease;
        }

        h1 { 
            color: #ff4d6d; 
            margin-bottom: 10px; 
        }

        .question {
            color: #4a4e69;
            font-size: 18px;
            margin-bottom: 25px;
        }

        #message {
            color: #4a4e69;
            line-height: 1.8;
            font-size: 16px;
            min-height: 150px;
            display: none; /* Hidden hanggang ma-click yung Yes */
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        #btnYes {
            background: linear-gradient(45deg, #ff4d6d, #ff758c);
            color: white;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.3);
        }
        
        #btnYes:hover { transform: scale(1.05); }

        #btnNo {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            position: relative; /* Kailangan ito para tumakbo yung button */
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: #ff4d6d;
            opacity: 0;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* Click Burst Hearts */
        .burst-heart {
            position: absolute;
            font-size: 15px;
            pointer-events: none;
            animation: burst 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>Hi Love! ✨</h1>
        <p class="question" id="questionText">Ready ka na ba sa surprise ko?</p>
        
        <div class="btn-container" id="btnGroup">
            <button id="btnYes">Yes na yes! 😍</button>
            <button id="btnNo">Ayoko nga 😝</button>
        </div>

        <p id="message"></p>
    </div>

    <script>
        // 1. Interactive 'No' Button (Tatakbo palayo sa mouse)
        const btnNo = document.getElementById('btnNo');
        
        btnNo.addEventListener('mouseover', () => {
            // Kinukuha yung size ng screen para di lumabas yung button
            const i = Math.floor(Math.random() * (window.innerWidth - 100));
            const j = Math.floor(Math.random() * (window.innerHeight - 50));
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = i + 'px';
            btnNo.style.top = j + 'px';
        });

        // 2. Interactive 'Yes' Button (Trigger ng Surprise)
        const btnYes = document.getElementById('btnYes');
        const btnGroup = document.getElementById('btnGroup');
        const questionText = document.getElementById('questionText');
        const msgEl = document.getElementById('message');

        const textToType = "Surprise! 😅 Ginawa ko 'tong simple website na 'to para lang sa'yo. I know it's a bit nerdy, pero I wanted to make something special na galing talaga sa effort ko. Thank you for always being there and for making my days brighter. I love you!";
        let index = 0;

        btnYes.addEventListener('click', () => {
            // Itago yung mga buttons at tanong
            btnGroup.style.display = 'none';
            questionText.style.display = 'none';
            
            // Ipakita yung message space
            msgEl.style.display = 'block';
            
            // Typewriter effect
            function typeWriter() {
                if (index < textToType.length) {
                    msgEl.innerHTML += textToType.charAt(index);
                    index++;
                    setTimeout(typeWriter, 50);
                }
            }
            typeWriter();

            // Umpisahan yung mga floating hearts mula sa baba
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.bottom = "-20px";
                heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
                heart.style.fontSize = (Math.random() * 15 + 10) + "px";
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 5000); // Burahin para iwas lag
            }, 300);
        });

        // 3. Interactive Background (Click Burst Effect)
        document.addEventListener('click', (e) => {
            // Gumawa ng 5 puso tuwing mag-ki-click sa screen
            for(let i = 0; i < 5; i++) {
                const heart = document.createElement("div");
                heart.classList.add("burst-heart");
                heart.innerHTML = i % 2 === 0 ? "💖" : "✨"; // Salit-salitang heart at sparkles
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                
                // Random directions na pagsabog
                const angle = Math.random() * Math.PI * 2;
                const velocity = 30 + Math.random() * 40;
                const tx = Math.cos(angle) * velocity + 'px';
                const ty = Math.sin(angle) * velocity + 'px';
                
                heart.style.setProperty('--tx', tx);
                heart.style.setProperty('--ty', ty);
                
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        });
    </script>
</body>
</html>
